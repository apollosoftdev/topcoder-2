version: "3.8"

services:
  devcontainer:  # nosemgrep: writable-filesystem-service
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:  # nosemgrep: exposing-docker-socket-volume
      - ..:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/guardrails
      - BACKEND_API_URL=http://localhost:8000
    depends_on:
      - postgres
    security_opt:
      - no-new-privileges:true

  postgres:  # nosemgrep: writable-filesystem-service
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=guardrails
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
